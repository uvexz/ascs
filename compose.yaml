services:
  ascs:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/ascs.db
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ascs-data:/app/data
    security_opt:
      - no-new-privileges:true
volumes:
  ascs-data:
