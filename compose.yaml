services:
  ascs:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      # Keep the local-file default for the bundled volume, but let .env point
      # the container at Turso (or another libSQL URL) when configured.
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/ascs.db}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ascs-data:/app/data
    security_opt:
      - no-new-privileges:true
volumes:
  ascs-data:
